[package]
name = "renzora-api"
version = "0.1.0"
edition = "2021"

[dependencies]
renzora-common = { path = "../common" }
renzora-models = { path = "../models" }
axum = { workspace = true }
axum-extra = { workspace = true }
sqlx = { workspace = true }
redis = { workspace = true }
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
rust-s3 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
totp-rs = { workspace = true }
rand = { workspace = true }
image = { workspace = true }
zip = { workspace = true }

[dev-dependencies]
# A WebSocket *client*, so the relay can be tested by driving two real sockets
# through it rather than by calling its internals. Both are already in the lock
# via axum's `ws` feature, so this adds nothing to the build.
tokio-tungstenite = "0.24"
futures-util = "0.3"
