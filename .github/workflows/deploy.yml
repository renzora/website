name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE: ghcr.io/renzora/website

jobs:
  # Build the app image on GitHub's runners (fast, cached) and push it to GHCR.
  # The droplet no longer compiles anything — it just pulls this image.
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          # Persistent layer cache across runs — dependency layers are reused, so
          # only the workspace crates recompile on a normal code change.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to DigitalOcean
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=60 ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'DEPLOY'
            set -e
            cd /opt/renzora-website

            # Pull latest code (compose file, nginx config, host-mounted assets)
            git fetch origin main
            git reset --hard origin/main

            # Fetch latest preview WASM from engine releases
            mkdir -p assets/wasm
            PREVIEW_URL=$(curl -sf "https://api.github.com/repos/${{ secrets.ENGINE_REPO }}/releases/latest" \
              | grep -o '"browser_download_url": "[^"]*renzora-preview-wasm[^"]*"' \
              | head -1 | cut -d'"' -f4 || true)
            if [ -n "$PREVIEW_URL" ]; then
              echo "Downloading preview WASM from: $PREVIEW_URL"
              curl -sfL "$PREVIEW_URL" -o /tmp/preview-wasm.zip
              unzip -o /tmp/preview-wasm.zip -d assets/wasm/ 2>/dev/null || true
              rm -f /tmp/preview-wasm.zip
            else
              echo "Warning: Could not fetch preview WASM — skipping"
            fi

            # Fetch the engine's web build for /engine. Best-effort: a droplet
            # that already has a build keeps serving it, and the engine's own
            # publish job re-fires this the next time a nightly lands, so a
            # missed fetch here is self-healing rather than something to hold
            # a deploy on. Must run before `compose up` — the app bind-mounts
            # ./engine, and docker would otherwise create it root-owned.
            ENGINE_REPO='${{ secrets.ENGINE_REPO }}' bash scripts/fetch-engine-wasm.sh \
              || echo "Warning: engine WASM fetch failed — keeping the build already on disk"

            # Log in to GHCR with the run-scoped token (no long-lived secret needed)
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

            # Pull the prebuilt image for this exact commit and restart (no build on the droplet)
            export APP_IMAGE=ghcr.io/renzora/website:${{ github.sha }}
            echo "Deploying image: $APP_IMAGE"
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io || true

            # Wait for health check
            echo "Waiting for health check..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "Health check passed"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Health check failed after 30 attempts"
                docker compose -f docker-compose.prod.yml logs app --tail=50
                exit 1
              fi
              sleep 2
            done

            # Apply any nginx.conf changes. A restart (not `nginx -s reload`) is
            # required: git reset replaces the file with a new inode, and a
            # single-file bind mount stays pinned to the old one until the
            # container restarts and re-resolves the path.
            docker compose -f docker-compose.prod.yml restart nginx
            for i in $(seq 1 15); do
              if curl -sf http://localhost/health > /dev/null 2>&1; then
                echo "nginx back up"
                break
              fi
              if [ $i -eq 15 ]; then
                echo "nginx failed to come back after restart"
                docker compose -f docker-compose.prod.yml logs nginx --tail=30
                exit 1
              fi
              sleep 2
            done

            # Cleanup old images (BuildKit/GHA cache is unaffected — builds run in CI now)
            docker image prune -f
            echo "Deploy successful"
          DEPLOY
        timeout-minutes: 10
